name: Build RISC-V ISA simulator (Spike)
on:
  push:
    branches:
      - 'main'
  pull_request:
  schedule:
    - cron: '32 22 * * *'

jobs:
  build:
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 30
    steps:
      - name: Check out the repository code
        uses: actions/checkout@v6

      - name: Clone spike source
        run: |
          git clone https://github.com/riscv-software-src/riscv-isa-sim.git

      - name: Install build-time dependencies
        run: |
          dnf install -y dtc

      - name: Build spike
        run: |
          cd riscv-isa-sim
          mkdir build && cd build
          ../configure --prefix=/opt/riscv-isa-sim
          make -j`nproc`
          make install
          find /opt/riscv-isa-sim/bin -type f -executable | xargs strip --strip-unneeded
          find /opt/riscv-isa-sim/lib -name "*.so" | xargs strip --strip-unneeded
          /opt/riscv-isa-sim/bin/spike --help

      - name: Package build output
        run: |
          tar -czvf riscv-isa-sim.tar.gz -C /opt riscv-isa-sim

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: spike-build
          path: riscv-isa-sim.tar.gz
          retention-days: 5

  test:
    needs: build
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        container:
          - ubuntu:jammy
          - ubuntu:noble
          - ubuntu:resolute
          - debian:12
          - debian:13
          - fedora:44
          - rockylinux:8
          - rockylinux:9
          - almalinux:10
    steps:
      - name: Check out the repository code
        uses: actions/checkout@v6

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: spike-build

      - name: Extract build
        run: |
          mkdir -p /opt
          tar -xzvf riscv-isa-sim.tar.gz -C /opt

      - name: Install runtime dependencies
        run: bash spike_smoketest/install_deps.sh ${{ matrix.container }}

      - name: Run smoke test
        run: |
          bash spike_smoketest/run_smoketest.sh /opt/riscv-isa-sim/bin/spike

      - name: Store test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log
          path: spike_smoketest/spike_out/**
          retention-days: 5

  decide_if_release:
    needs: [build, test]
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule'
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - name: Decide if to make a release
        id: decide
        run: |
          # Only release from scheduled jobs on Sunday
          if [ "$(date +%u)" -eq 7 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [build, test, decide_if_release]
    runs-on: ubuntu-24.04
    if: "${{ needs.decide_if_release.outputs.proceed == 'true' }}"
    timeout-minutes: 5
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: spike-build
          path: dist
      - name: Prepare release title
        id: title
        run: echo "value=Spike build $(date -u +%G-w%V)" >> "$GITHUB_OUTPUT"
      - name: Create release and attach the assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.title.outputs.value }}
          files: dist/riscv-isa-sim.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}