name: Build RISC-V ISA simulator (Spike)
on:
  push:
  schedule:
    - cron: '42 20 * * 2,4,6'
jobs:
  build:
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Check out the repository code
        uses: actions/checkout@v6

      - name: Clone spike source
        run: |
          git clone https://github.com/riscv-software-src/riscv-isa-sim.git

      - name: Install build-time dependencies
        run: |
          dnf install -y dtc

      - name: Build spike
        run: |
          cd riscv-isa-sim
          mkdir build && cd build
          ../configure --prefix=/opt/riscv-isa-sim
          make -j`nproc`
          make install
          find /opt/riscv-isa-sim/bin -type f -executable | xargs strip --strip-unneeded
          find /opt/riscv-isa-sim/lib -name "*.so" | xargs strip --strip-unneeded
          /opt/riscv-isa-sim/bin/spike --help

      - name: Package build output
        run: |
          tar -czvf riscv-isa-sim.tar.gz -C /opt riscv-isa-sim

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: spike-build
          path: riscv-isa-sim.tar.gz
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        container:
          - ubuntu:jammy
          - ubuntu:noble
          - ubuntu:resolute
          - debian:12
          - debian:13
          - fedora:44
          - rockylinux:8
          - rockylinux:9
    steps:
      - name: Check out the repository code
        uses: actions/checkout@v6

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: spike-build

      - name: Extract build
        run: |
          mkdir -p /opt
          tar -xzvf riscv-isa-sim.tar.gz -C /opt

      - name: Install runtime dependencies
        run: bash spike_smoketest/install_deps.sh ${{ matrix.container }}

      - name: Run smoke test
        run: |
          bash spike_smoketest/run_smoketest.sh /opt/riscv-isa-sim/bin/spike

      - name: Store test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log
          path: spike_smoketest/spike_out/**
          retention-days: 7
