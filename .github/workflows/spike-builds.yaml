name: Build RISC-V ISA simulator (Spike)
on:
  push:
  schedule:
    - cron: '42 20 * * 2,4,6'
jobs:
  build:
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Check out the repository code
        uses: actions/checkout@v6

      - name: Clone spike source
        run: |
          git clone https://github.com/riscv-software-src/riscv-isa-sim.git

      - name: Install build-time dependencies
        run: |
          dnf install -y dtc

      - name: Build spike
        run: |
          cd riscv-isa-sim
          mkdir build && cd build
          ../configure --prefix=/opt/riscv-isa-sim
          make -j`nproc`
          make install
          /opt/riscv-isa-sim/bin/spike --help

      - name: Package build output
        run: |
          tar -czvf riscv-isa-sim.tar.gz -C /opt riscv-isa-sim

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: spike-build
          path: riscv-isa-sim.tar.gz
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: spike-build

      - name: Extract build
        run: |
          mkdir -p /opt
          tar -xzvf riscv-isa-sim.tar.gz -C /opt

      - name: Run smoke-test
        run: |
          bash spike_smoketest/run_smoketest.sh /opt/riscv-isa-sim/bin/spike
